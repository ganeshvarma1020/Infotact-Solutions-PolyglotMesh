spring.application.name=polyglotmesh
server.port=${PORT:8080}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/polyglotmesh}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:meshadmin}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:meshsecret}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
management.endpoints.web.exposure.include=health,info,metrics
